[project]
name = "irckaaja"
version = "0.3.0"
description = ""
authors = [
    { name = "Jukka-Pekka Virtanen", email = "virtanen@jukk.is" },
]
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "configobj",
]

[dependency-groups]
dev = [
    "pre-commit",
    "black",
    "flake8",
    "isort",
    "autoflake",
    "mypy<2",
    "pyupgrade",
    "setuptools",
    "pytest",
    "build",
    "twine",
    "pytest-cov",
    "irc-parser-tests",
]

[tool.mypy]
python_version = "3.9"
disallow_untyped_defs = "True"
ignore_missing_imports = "True"
exclude = ["^\\.venv/"]

# pytest's own sources use 3.10+ syntax, which mypy parses under our 3.9 target
[[tool.mypy.overrides]]
module = ["pytest.*", "_pytest.*"]
follow_imports = "skip"

[tool.black]
line-length = 80

[tool.isort]
line_length = 80
profile = "black"

[tool.flake8]
max-line-length = 80

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["irckaaja"]

[tool.coverage.run]
source = ["irckaaja"]
omit = ["irckaaja/scripts/*"]

[tool.coverage.report]
fail_under = 81

[tool.pytest.ini_options]
addopts = "--cov=irckaaja"
